name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Memungkinkan Anda memicu build secara manual kapan saja

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest # Menggunakan image resmi ESP-IDF terbaru

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone ESP-DSP Submodule
        run: |
          mkdir -p components
          if [ ! -d "components/esp-dsp" ]; then
            git clone --recursive https://github.com/espressif/esp-dsp.git components/esp-dsp
          fi

      - name: Build Firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware-binaries
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/esp32s3_audio_dsp.bin
            build/flasher_args.json